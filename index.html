or:pointer;transition:transform .15s ease,box-shadow .15s ease,background .15s ease}.team-btn:hover{transform:translateY(-2px);box-shadow:0 7px 18px rgba(38,22,63,.12);background:#faf7ff}.team-btn:focus-visible{outline:4px solid #f2b705;outline-offset:3px}.sensory .team-btn:hover{transform:none;box-shadow:none;background:#f7f7f8}.purple{border-color:#7b4bc4}.green{border-color:#2e7d4e}.red{border-color:#b74444}.blue{border-color:#3778b7}.help-purple{background:#7b4bc4!important;color:#fff!important;border-color:#7b4bc4!important}.help-purple:hover{background:#6840a8!important;border-color:#6840a8!important}.external{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}.notice{font-size:.86rem;color:var(--muted);text-align:center}.hidden{display:none!important}.teacher-gate{border:2px dashed var(--accent);background:#fbf8ff}.location{font-size:1.25rem;font-weight:900;padding:18px;background:#211a2d;color:#fff;border-radius:16px}.footer-tools{margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}.global-nav{display:flex;gap:8px;justify-content:space-between;margin:0 0 12px}.global-nav .mini{flex:1;border-radius:12px}.global-nav .restart{color:#7a2631;border-color:#d9b9be}.global-nav .mini:disabled{opacity:.45;cursor:not-allowed}

<body>
<main class="app" id="app">
  <header class="topbar hidden" id="topbar">
    <div class="toprow"><div class="brand">🐙 Lenox Quest</div><div><span class="teamchip" id="teamChip"></span> <span class="modechip" id="modeChip"></span></div></div>

</main>
<script>
/* LENOX LIBRARY QUEST — V1.6
   External URLs and final octopus locations are intentionally centralized here.
   Replace the placeholder URLs/locations after final verification; no game logic needs to change. */
const CONFIG={
  exploreMinutes:10,
  urls:{
    libraryHome:'https://www.uww.edu/library',
    guides:'https://libguides.uww.edu/',
    appointment:'https://uww.navigate.eab.com/app/#/authentication/remote/',
    librarySearch:'https://www.uww.edu/library',
    scholar:'https://scholar.google.com/'
  },
  locations:{
    Purple:'[PURPLE TEAM LOCATION — replace with exact student-facing direction]',
    Green:'[GREEN TEAM LOCATION — replace with exact student-facing direction]',
    Red:'[RED TEAM LOCATION — replace with exact student-facing direction]',
    Blue:'[BLUE TEAM LOCATION — replace with exact student-facing direction]'
  }
};
const FIRST_AID_EMAIL_ENDPOINT='https://script.google.com/macros/s/AKfycbxIyrGWy98MV_Xm--IZG9WFzTkPshWlaDihvbZRXyY-4iV9tvfmUceQbKA401XeOE7BdA/exec';
const ROUTES={
 Purple:['tech','ask','guides','camille'],
 Green:['ask','guides','camille','tech'],
 Red:['guides','camille','tech','ask'],
 Blue:['camille','tech','ask','guides']
};
const LABELS={tech:'🎒 Hidden Tech',ask:'💬 24/7 Help',guides:'📖 Guides',camille:'👤 Find Camille'};
const fresh={mode:null,team:null,phase:'welcome',exploreIndex:0,exploreDone:[],exploreEnds:null,researchStep:0,finalStep:0,cardChecked:false,huntFound:false};
let state=Object.assign({},fresh,JSON.parse(localStorage.getItem('lenoxQuestV1')||'{}'));
let navHistory=JSON.parse(localStorage.getItem('lenoxQuestHistoryV1')||'[]');
let timerHandle=null;
const screen=document.getElementById('screen'), topbar=document.getElementById('topbar');
function save(){localStorage.setItem('lenoxQuestV1',JSON.stringify(state));localStorage.setItem('lenoxQuestHistoryV1',JSON.stringify(navHistory))}
function snapshot(){return JSON.parse(JSON.stringify(state))}
function pushHistory(){navHistory.push(snapshot());if(navHistory.length>60)navHistory.shift();save()}
function setState(p){pushHistory();Object.assign(state,p);save();render()}
function goBack(){if(!navHistory.length)return;stopReading(false);state=Object.assign({},fresh,navHistory.pop());save();render()}
function globalNav(){if(state.phase==='welcome')return '';return `<nav class="global-nav" aria-label="Quest navigation"><button class="mini" onclick="goBack()" ${navHistory.length?'':'disabled'}>← Back</button><button class="mini restart" onclick="resetQuest()">↻ Restart</button></nav>`}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function btn(label,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${label}</button>`}
function readTools(){return `${globalNav()}<div class="listen-panel" aria-label="Read aloud controls"><div class="listen-row"><span class="listen-label">🔊 Read this screen aloud</span><button onclick="startReading()" id="playRead">▶ Read</button><button onclick="pauseReading()" id="pauseRead" disabled>⏸ Pause</button><button onclick="stopReading()" id="stopRead" disabled>⏹ Stop</button><span class="listen-status" id="listenStatus" aria-live="polite">Audio is off. Start it whenever you want.</span></div></div><div class="toolbar"><button class="mini" onclick="toggleMode()">◐ Switch display mode</button></div>`}
function shell(html,progress=0,read=true){stopReading(false);readAloudActive=false;topbar.classList.remove('hidden');document.body.classList.toggle('sensory',state.mode==='Sensory-Friendly');document.body.classList.toggle('standard',state.mode==='Standard');document.getElementById('teamChip').textContent=state.team?state.team+' Team':'';document.getElementById('modeChip').textContent=state.mode||'';document.getElementById('progressBar').style.width=progress+'%';screen.innerHTML=(read?readTools():'')+html;window.scrollTo(0,0)}
function simple(html){stopReading(false);readAloudActive=false;topbar.classList.add('hidden');document.body.classList.toggle('sensory',state.mode==='Sensory-Friendly');document.body.classList.toggle('standard',state.mode==='Standard');screen.innerHTML=globalNav()+html;window.scrollTo(0,0)}
function stripEmojiForSpeech(t){
  return Array.from(t).filter(ch=>{
    const cp=ch.codePointAt(0);
    return !((cp>=0x1F000&&cp<=0x1FAFF)||(cp>=0x2600&&cp<=0x27BF)||cp===0xFE0E||cp===0xFE0F||cp===0x200D);
  }).join('');
}
function naturalizeSpeech(t){
  t=t
    .replace(/\bhalf[-–—]sheet\b/gi,'half sheet')
    .replace(/\bone[-–—]on[-–—]one\b/gi,'individual')
    .replace(/\bI[\s.-]+T\b/g,'it')
    .replace(/\bO[\s.-]+R\b/g,'or')
    .replace(/\bIT\b/g,'it')
    .replace(/\bOR\b/g,'or');
  return stripEmojiForSpeech(t)
    .replace(/\bUWW\b/g,'U W W')
    .replace(/\b3D\b/gi,'three D')
    .replace(/\b24\/7\b/g,'twenty four seven')
    .replace(/\bAPA\b/g,'A P A')
    .replace(/\bMLA\b/g,'M L A')
    .replace(/\bASA\b/g,'A S A')
    .replace(/\bTurabian\b/g,'Turabian')
    .replace(/\bAND\b/g,'AND, in all capital letters')
    .replace(/\s*\+\s*/g,' and ')
    .replace(/[→←↺↻]/g,' ')
    .replace(/[|]/g,', ')
    .replace(/[()[\]{}]/g,' ')
    .replace(/[_*#]/g,' ')
    .replace(/\s*[.:;!?]+\s*/g,', ')
    .replace(/\s*\/\s*/g,' ')
    .replace(/\s*[-–—]\s*/g,', ')
    .replace(/,+/g,',')
    .replace(/\s+,/g,',')
    .replace(/\s+/g,' ')
    .replace(/^[,\s]+|[,\s]+$/g,'')
    .trim();
}
function readableText(){
  const parts=[];
  const spoken=new Set();

  function isActuallyVisible(el){
    if(!el || !el.isConnected)return false;
    if(el.closest('.hidden,[aria-hidden="true"],template'))return false;
    let node=el;
    while(node && node!==screen){
      const cs=window.getComputedStyle(node);
      if(cs.display==='none' || cs.visibility==='hidden' || cs.visibility==='collapse' || parseFloat(cs.opacity)===0)return false;
      node=node.parentElement;
    }
    return true;
  }

  // Read only currently displayed semantic content. Future Guides stages are
  // not in the DOM at all; this visibility check is an additional safeguard.
  const selector='h1,h2,h3,.eyebrow,.lead,p,li,.searchstring,.callout,button.choice';
  screen.querySelectorAll(selector).forEach(el=>{
    if(!isActuallyVisible(el))return;
    if(el.closest('.listen-panel,.toolbar,.notice,.global-nav,.progress,.timer,.route,.footer-tools'))return;
    if(el.matches('.external,.btn,.mini') && !el.matches('button.choice'))return;

    const parentSemantic=el.parentElement && el.parentElement.closest(selector);
    if(parentSemantic && parentSemantic!==el && isActuallyVisible(parentSemantic))return;

    const raw=(el.innerText||el.textContent||'').trim();
    const cleaned=naturalizeSpeech(raw);
    if(!cleaned || spoken.has(cleaned))return;
    spoken.add(cleaned);

    // Multiple-choice answers need a noticeably longer pause so TTS does not
    // merge adjacent options (especially APA / MLA / Turabian / ASA).
    if(el.matches('button.choice')){
      parts.push(cleaned+'.   ...   ');
    }else{
      parts.push((/[.!?]$/.test(cleaned)?cleaned:cleaned+'.')+'  ');
    }
  });

  return parts.join(' ');
}
let readAloudActive=false;
let activeUtterance=null;
let selectedSpeechVoice=null;

function chooseSpeechVoice(){
  if(!('speechSynthesis' in window))return null;
  const voices=window.speechSynthesis.getVoices()||[];
  if(!voices.length)return null;
  const english=voices.filter(v=>/^en([-_]|$)/i.test(v.lang||''));
  const preferred=[
    /Enhanced/i,/Premium/i,/Natural/i,
    /Microsoft.*Aria/i,/Microsoft.*Jenny/i,
    /Google.*English.*US/i,/Google.*English/i,
    /Samantha/i,/Ava/i,/Allison/i,/Susan/i,/Karen/i,/Moira/i
  ];
  for(const rx of preferred){
    const hit=english.find(v=>rx.test(v.name||''));
    if(hit)return hit;
  }
  return english.find(v=>v.default)||english[0]||voices.find(v=>v.default)||voices[0]||null;
}

function refreshSpeechVoice(){
  selectedSpeechVoice=chooseSpeechVoice();
}

if('speechSynthesis' in window){
  refreshSpeechVoice();
  if('onvoiceschanged' in speechSynthesis){
    speechSynthesis.onvoiceschanged=refreshSpeechVoice;
  }
}

function setListenUI(status,playing=false,paused=false){
  const st=document.getElementById('listenStatus');
  const play=document.getElementById('playRead');
  const pause=document.getElementById('pauseRead');
  const stop=document.getElementById('stopRead');
  if(st)st.textContent=status;
  if(play)play.disabled=playing&&!paused;
  if(pause){
    pause.disabled=!playing;
    pause.textContent=paused?'▶ Resume':'⏸ Pause';
  }
  if(stop)stop.disabled=!playing;
}

function startReading(){
  if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){
    setListenUI('Read aloud is not supported in this browser.');
    return;
  }

  readAloudActive=true;

  if(speechSynthesis.paused && activeUtterance){
    speechSynthesis.resume();
    setListenUI('Reading this screen aloud…',true,false);
    return;
  }

  const t=readableText();
  if(!t){
    setListenUI('There is nothing to read on this screen.');
    return;
  }

  speechSynthesis.cancel();
  refreshSpeechVoice();

  const utterance=new SpeechSynthesisUtterance(t);
  activeUtterance=utterance;
  if(selectedSpeechVoice)utterance.voice=selectedSpeechVoice;
  utterance.lang=(selectedSpeechVoice&&selectedSpeechVoice.lang)||'en-US';
  utterance.rate=.92;
  utterance.pitch=1;
  utterance.volume=1;

  utterance.onstart=()=>{
    if(activeUtterance===utterance)setListenUI('Reading this screen aloud…',true,false);
  };
  utterance.onend=()=>{
    if(activeUtterance===utterance){
      activeUtterance=null;
      setListenUI('Finished reading. You can read it again anytime.');
    }
  };
  utterance.onerror=(event)=>{
    if(activeUtterance===utterance){
      activeUtterance=null;
      const harmless=event&&event.error==='canceled';
      if(!harmless)setListenUI('Read aloud stopped. Tap Read to try again.');
    }
  };

  // A direct call from the user's tap is the most reliable pattern on mobile browsers.
  speechSynthesis.speak(utterance);
}

function speakNewFeedback(feedbackEl){
  if(!readAloudActive || !feedbackEl || !('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window))return;
  const speechClone=feedbackEl.cloneNode(true);
  speechClone.querySelectorAll('strong,h1,h2,h3,p,li').forEach(el=>el.appendChild(document.createTextNode(' || ')));
  const spoken=(speechClone.innerText||speechClone.textContent||'')
    .split('||')
    .map(part=>naturalizeSpeech(part))
    .filter(Boolean)
    .map(part=>/[.!?]$/.test(part)?part:part+'.')
    .join('   ...   ');
  if(!spoken)return;

  speechSynthesis.cancel();
  refreshSpeechVoice();

  const utterance=new SpeechSynthesisUtterance(spoken);
  activeUtterance=utterance;
  if(selectedSpeechVoice)utterance.voice=selectedSpeechVoice;
  utterance.lang=(selectedSpeechVoice&&selectedSpeechVoice.lang)||'en-US';
  utterance.rate=.92;
  utterance.pitch=1;
  utterance.volume=1;

  utterance.onstart=()=>{
    if(activeUtterance===utterance)setListenUI('Reading new feedback aloud…',true,false);
  };
  utterance.onend=()=>{
    if(activeUtterance===utterance){
      activeUtterance=null;
      setListenUI('Feedback finished. Read Aloud is still on.');
    }
  };
  utterance.onerror=(event)=>{
    if(activeUtterance===utterance){
      activeUtterance=null;
      const harmless=event&&event.error==='canceled';
      if(!harmless)setListenUI('Read aloud stopped. Tap Read to try again.');
    }
  };
  speechSynthesis.speak(utterance);
}

function pauseReading(){
  if(!('speechSynthesis' in window)||!activeUtterance)return;
  if(speechSynthesis.paused){
    speechSynthesis.resume();
    setListenUI('Reading this screen aloud…',true,false);
  }else{
    speechSynthesis.pause();
    setListenUI('Reading paused.',true,true);
  }
}

function stopReading(update=true){
  if('speechSynthesis' in window)speechSynthesis.cancel();
  activeUtterance=null;
  if(update)setListenUI('Reading stopped. Start again whenever you want.');
}
function toggleMode(){stopReading(false);state.mode=state.mode==='Standard'?'Sensory-Friendly':'Standard';save();render()}

function rqmc(opts,c,feedback){let encoded=encodeURIComponent(feedback).replace(/'/g,'%27');return `${opts.map((o,i)=>`<button class="choice" onclick="rqAnswer(this,${i},${c},'${encoded}')">${esc(o)}</button>`).join('')}<div class="rqfb"></div>`}
function rqAnswer(el,i,c,encodedFeedback){let feedback=decodeURIComponent(encodedFeedback),card=el.parentElement,buttons=[...card.querySelectorAll(':scope > .choice')],fb=card.querySelector('.rqfb');buttons.forEach(x=>x.classList.remove('wrong'));if(i===c){el.classList.add('correct');buttons.forEach(x=>x.disabled=true);fb.innerHTML=`<div class="callout success">${feedback}</div>${rqContinue('CONTINUE →')}`}else{el.classList.add('wrong');fb.innerHTML=`<div class="callout"><strong>Not quite yet.</strong> Think about what you practiced with the elephant example. Try again.</div>`}  speakNewFeedback(fb);
}
function rqContinue(label){return `<button class="btn" onclick="nextResearch()">${label}</button>`}

const RESEARCH_TIMER_SECONDS=15*60;
let researchTimerStartedAt=null;
let researchTimerInterval=null;

function startResearchTimer(){
  if(researchTimerStartedAt===null){
    researchTimerStartedAt=Date.now();
  }
  if(researchTimerInterval) clearInterval(researchTimerInterval);
  researchTimerInterval=setInterval(updateResearchTimer,1000);
  updateResearchTimer();
}
function researchSecondsLeft(){
  if(researchTimerStartedAt===null) return RESEARCH_TIMER_SECONDS;
  return Math.max(0,RESEARCH_TIMER_SECONDS-Math.floor((Date.now()-researchTimerStartedAt)/1000));
}
function researchTimerMarkup(){
  const left=researchSecondsLeft();
  const mins=Math.floor(left/60);
  const secs=String(left%60).padStart(2,'0');
  const cls=left===0?' timer-done':(left<=180?' timer-low':'');
  const label=left===0?'Research time is up — finish your current step':'Research Quest time';
  return `<div class="research-timer${cls}" id="researchTimer" role="timer" aria-label="${label}">
    <span class="timer-label">⏱ ${label}</span>
    <span class="timer-value" id="researchTimerValue">${mins}:${secs}</span>
  </div>`;
}
function updateResearchTimer(){
  const timer=document.getElementById('researchTimer');
  const value=document.getElementById('researchTimerValue');
  if(!timer||!value) return;
  const left=researchSecondsLeft();
  const mins=Math.floor(left/60);
  const secs=String(left%60).padStart(2,'0');
  value.textContent=`${mins}:${secs}`;
  timer.classList.toggle('timer-low',left>0&&left<=180);
  timer.classList.toggle('timer-done',left===0);
  const label=left===0?'Research time is up — finish your current step':'Research Quest time';
  const labelNode=timer.querySelector('.timer-label');
  if(labelNode) labelNode.textContent=(left===0?'⏱ ':'⏱ ')+label;
  timer.setAttribute('aria-label',label);
  if(left===0&&researchTimerInterval){
    clearInterval(researchTimerInterval);
    researchTimerInterval=null;
  }
}
function injectResearchTimer(){
  if(researchTimerStartedAt===null) return;
  const app=document.querySelector('#app');
  if(!app||document.getElementById('researchTimer')){updateResearchTimer();return;}
  app.insertAdjacentHTML('afterbegin',researchTimerMarkup());
  updateResearchTimer();
}
function nextResearch(){pushHistory();state.researchStep++;save();render()}
function copyText(t,b){navigator.clipboard?.writeText(t);b.textContent='✓ COPIED'}
function previousResearch(){
  stopReading(false);
  if((state.researchStep||0)>0){
    pushHistory();
    state.researchStep--;
    save();
    render();
    return;
  }
  // First Research screen: return to the Return-to-Base checkpoint,
  // not to an arbitrary older navigation snapshot.
  pushHistory();
  state.phase='return';
  state.returnReason=state.returnReason||'complete';
  save();
  render();
}
function showLibraryArticleHelp(btn){
  const fb=document.getElementById('libraryArticleHelp');
  if(!fb)return;
  btn.disabled=true;
  fb.innerHTML=`<div class="callout"><strong>ASK CAMILLE FOR HELP</strong><p>If you can't find a useful article, ask Camille. She can help you look at your search results, use the Articles filter, and choose an article to put on your Quest Card.</p></div><button class="btn secondary" onclick="nextResearch()">ARTICLE TITLE IS NOW ON OUR CARD →</button>`;
  speakNewFeedback(fb);
}
function showBookHelp(btn){
  const fb=document.getElementById('bookHelp');
  if(!fb)return;
  btn.disabled=true;
  fb.innerHTML=`<div class="callout"><strong>ASK CAMILLE FOR HELP</strong><p>If you can't find a useful book or aren't sure where to find the call number, ask Camille. She can help you find the book record and locate the call number.</p></div><button class="btn secondary" onclick="nextResearch()">BOOK + CALL NUMBER ARE NOW ON OUR CARD →</button>`;
  speakNewFeedback(fb);
}
function showScholarHelp(btn){
  const fb=document.getElementById('scholarHelp');
  if(!fb)return;
  btn.disabled=true;
  fb.innerHTML=`<div class="callout"><strong>ASK CAMILLE FOR HELP</strong><p>If you can't find a useful Google Scholar article, ask Camille. She can help you look at the results and choose an article to put on your Quest Card.</p></div><button class="btn secondary" onclick="nextResearch()">GOOGLE SCHOLAR ARTICLE IS NOW ON OUR CARD →</button>`;
  speakNewFeedback(fb);
}
function showRelatedHelp(btn){
  const fb=document.getElementById('relatedHelp');
  if(!fb)return;
  btn.disabled=true;
  fb.innerHTML=`<div class="callout"><strong>ASK CAMILLE FOR HELP</strong><p>If you can't find Related articles or aren't sure which related article to choose, ask Camille. She can help you find the link and choose an article to put on your Quest Card.</p></div><button class="btn secondary" onclick="nextResearch()">RELATED ARTICLE IS NOW ON OUR CARD →</button>`;
  speakNewFeedback(fb);
}
function research(){
  let i=state.researchStep||0;
  if(i>=researchScreens.length){state.phase='hunt';save();return render()}
  if(i===0 && researchTimerStartedAt===null) startResearchTimer();
  const timer=(researchTimerStartedAt!==null)?researchTimerMarkup():'';
  shell(`${timer}<div class="callout" style="padding:10px 12px;margin-top:0"><button class="mini" style="width:100%;border-radius:12px" onclick="previousResearch()">← BACK TO PREVIOUS RESEARCH STEP</button></div>${researchScreens[i]()}`,45+Math.min(43,i*3.2))
  updateResearchTimer();
}
function teacherUnlock(){pushHistory();state.cardChecked=true;state.phase='hunt';save();render()}
function hunt(){let loc=CONFIG.locations[state.team];shell(`<div class="hero"><div class="octo">🔓</div><div class="eyebrow">Card verified</div><h1>OCTOPUS LOCATION UNLOCKED!</h1></div><div class="card"><h2>${state.team==='Purple'?'🟣':state.team==='Green'?'🟢':state.team==='Red'?'🔴':'🔵'} ${state.team.toUpperCase()} TEAM</h2><p class="bigline">YOUR OCTOPUS IS WAITING.</p><p>GO TO:</p><div class="location">${esc(loc)}</div><p>Find the <strong>${state.team.toUpperCase()} octopus</strong>.</p>${btn('🐙 WE FOUND IT!','foundOctopus()')}</div>`,92)}
function foundOctopus(){pushHistory();state.huntFound=true;state.phase='photo';save();render()}
function photo(){shell(`<div class="hero"><div class="octo">🐙</div><h1>YOU FOUND IT!</h1></div><div class="card"><p>Your octopus was <strong>3D printed right here at Lenox Library.</strong></p><div class="callout success"><p class="bigline">🖨️ YOU CAN USE OUR 3D PRINTER TOO.</p><p>Lenox's 3D printer is available to students.</p></div><h2>📸 Octopus Proof</h2><p>Take a photo of your team's octopus with your phone.</p><p><strong>Leave the octopus where you found it.</strong></p><p>Return to Camille and <strong>show her your photo.</strong></p>${btn('WE SHOWED CAMILLE →',"setState({phase:'complete'})")}</div>`,96)}
function validFirstAidEmail(value){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)}
function firstAidForm(){return `<div class="card first-aid-send"><div class="eyebrow">Take the help with you</div><h2>🩹 Research First Aid</h2><p>Email yourself everything you practiced today, plus quick links to Lenox Library, Ask a Librarian, and research help with Camille.</p><p class="small"><strong>Sharing one phone?</strong> Send it to one teammate, then enter the next email address. Email addresses are not saved in the Quest.</p><label for="firstAidEmail">Email address</label><input id="firstAidEmail" type="email" inputmode="email" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="name@example.com" aria-describedby="firstAidStatus"><button class="btn" id="firstAidSendBtn" onclick="sendResearchFirstAid()">EMAIL RESEARCH FIRST AID →</button><div id="firstAidStatus" class="first-aid-status" role="status" aria-live="polite"></div><div id="firstAidAgain" class="first-aid-actions hidden"></div></div>`}
async function sendResearchFirstAid(){
 const input=document.getElementById('firstAidEmail'),status=document.getElementById('firstAidStatus'),button=document.getElementById('firstAidSendBtn'),again=document.getElementById('firstAidAgain');
 if(!input||!status||!button)return;
 const email=input.value.trim();
 if(!validFirstAidEmail(email)){status.textContent='Please enter a valid email address.';input.focus();return}
 if(!FIRST_AID_EMAIL_ENDPOINT){status.textContent='Email delivery is not connected yet. Ask Camille to connect the Research First Aid email service before class.';return}
 button.disabled=true;status.textContent='Sending…';
 try{
  const response=await fetch(FIRST_AID_EMAIL_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'send_research_first_aid',email:email})});
  const data=await response.json();
  if(!response.ok||!data.ok)throw new Error('Send failed');
  input.value='';input.classList.add('hidden');button.classList.add('hidden');
  status.textContent='✓ Sent! Research First Aid is on its way.';
  again.classList.remove('hidden');
  again.innerHTML=`<button class="btn secondary" onclick="sendFirstAidAgain()">SEND TO ANOTHER TEAMMATE</button><button class="btn secondary" onclick="finishFirstAid()">FINISH QUEST</button>`;
 }catch(err){status.textContent="That didn't send. Try again or ask Camille for help."}
 finally{button.disabled=false}
}
function sendFirstAidAgain(){
 const input=document.getElementById('firstAidEmail'),status=document.getElementById('firstAidStatus'),button=document.getElementById('firstAidSendBtn'),again=document.getElementById('firstAidAgain');
 input.value='';input.classList.remove('hidden');button.classList.remove('hidden');again.classList.add('hidden');again.innerHTML='';status.textContent='Enter the next teammate’s email address.';input.focus()
}
function finishFirstAid(){const box=document.querySelector('.first-aid-send');if(!box)return;box.innerHTML=`<div class="callout success"><strong>✓ QUEST COMPLETE</strong><p>Keep Research First Aid for the next time you need a place to start—or a person to ask.</p></div>`}
function complete(){shell(`<div class="hero"><div class="octo">🐙</div><div class="eyebrow">Quest complete</div><h1>YOU DID IT.</h1></div><div class="card"><p>Today you:</p><ul class="checklist"><li>🗺️ found library services</li><li>🔎 built searches</li><li>📄 found an article</li><li>📚 found a book</li><li>🔢 found a call number</li><li>🎓 searched Google Scholar</li><li>🔗 followed Related articles</li><li>💬 found ways to get help</li><li>🖨️ discovered student 3D printing</li></ul></div><div class="callout"><p><strong>You don't need to remember everything.</strong></p><p class="bigline">You just need to know where to come back when you need it.</p></div>${firstAidForm()}<div class="footer-tools"><button class="mini" onclick="resetQuest()">↺ Reset for another class</button></div>`,100)}
function render(){clearInterval(timerHandle);if(state.phase==='welcome')welcome();else if(state.phase==='mode')mode();else if(state.phase==='team')team();else if(state.phase==='rules')rules();else if(state.phase==='explore')explore();else if(state.phase==='return')returnBase();else if(state.phase==='research')research();else if(state.phase==='hunt')hunt();else if(state.phase==='photo')photo();else complete()}
render();


</script>
